<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감사합니다 | BlessingQ</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme-preference');
        if (pref === 'light' || pref === 'dark') {
          document.documentElement.dataset.theme = pref;
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="assets/js/main.js" defer></script>
</head>
<body class="thank-you-body" data-page="thank-you">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="BlessingQ Home">
        <img
          src="assets/images/favicon.svg"
          alt=""
          width="28"
          height="28"
          class="brand-mark"
          aria-hidden="true"
        />
        <span>BlessingQ</span>
      </a>

      <div class="header-controls">
        <button
          id="lang-toggle"
          class="glass-pill-btn"
          type="button"
          aria-label="Switch language to English"
        >EN</button>

        <div class="theme-pill-group" role="group" aria-label="테마 선택" data-i18n-aria-label="themeGroupAria">
          <button
            class="theme-choice"
            type="button"
            data-theme-choice="system"
            aria-pressed="true"
            data-i18n="themeSystem"
          >자동</button>
          <button
            class="theme-choice"
            type="button"
            data-theme-choice="light"
            aria-pressed="false"
            data-i18n="themeLight"
          >라이트</button>
          <button
            class="theme-choice"
            type="button"
            data-theme-choice="dark"
            aria-pressed="false"
            data-i18n="themeDark"
          >다크</button>
        </div>
      </div>
    </div>
  </header>

  <main class="thank-you-main" id="main-content">
    <article class="thank-you-card">
      <div class="thank-check" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h1 data-i18n="thankTitle">감사합니다!</h1>
      <p data-i18n="thankSubtitle">메시지가 성공적으로 전송되었습니다. 확인 후 가능한 한 빠르게 회신드리겠습니다.</p>
      <div class="thank-meta" data-i18n="thankMeta">수신 이메일: ejok9194@gmail.com</div>
      <a href="index.html" class="btn btn-primary" data-i18n="thankBack">포트폴리오로 돌아가기</a>
    </article>
  </main>
</body>
</html>
